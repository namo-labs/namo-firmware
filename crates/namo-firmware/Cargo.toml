[package]
name = "namo-firmware"
version = "0.1.0"
edition = "2021"
description = "나모 파일럿 ESP32-S3 펌웨어"

[lib]
name = "namo_firmware"
path = "src/lib.rs"

[[bin]]
name = "namo-firmware"
path = "src/main.rs"

[[bin]]
name = "pinscan"
path = "src/bin/pinscan.rs"

[[bin]]
name = "floattest"
path = "src/bin/floattest.rs"

[[bin]]
name = "blescan"
path = "src/bin/blescan.rs"

[[bin]]
name = "netcheck"
path = "src/bin/netcheck.rs"

[[bin]]
name = "pumptest"
path = "src/bin/pumptest.rs"

[[bin]]
name = "pumprun"
path = "src/bin/pumprun.rs"

[[bin]]
name = "wifiscan"
path = "src/bin/wifiscan.rs"

[dependencies]
log = "0.4"
esp-idf-svc = "0.52.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
namo-core = { path = "../namo-core" }
esp32-nimble = "0.12"
toml-cfg = "0.2"

[build-dependencies]
embuild = "0.33"

[profile.release]
opt-level = "s"

[profile.dev]
opt-level = "z"
debug = true
