# monitor 서비스 이미지를 빌드해 ghcr.io에 올립니다.
#
# 홈서버의 k3s가 aarch64라 arm64가 필요합니다. amd64도 함께 만들어 두면
# 다른 곳에서 확인할 때 편합니다.
name: monitor

on:
  push:
    branches: [master]
    paths:
      - "monitor/**"
      - ".github/workflows/monitor.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/namo-monitor

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: monitor/go.sum
      - name: 검사
        working-directory: monitor
        run: |
          go vet ./...
          go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: monitor
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
