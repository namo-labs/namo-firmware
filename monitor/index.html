<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>나모 파일럿</title>
<style>
  :root {
    --bg: #fbfbfa; --card: #fff; --fg: #1a1a18; --dim: #6b6b66;
    --line: #e4e4e0; --accent: #2d7dd2; --water: #3aa76d; --warn: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614; --card: #201e1c; --fg: #ece9e4; --dim: #98938c;
      --line: #322f2c; --accent: #63a4e8; --water: #55c98a; --warn: #e8705f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 1.25rem 1rem 3rem; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    line-height: 1.5; max-width: 46rem; margin-inline: auto;
  }
  h1 { font-size: 1.1rem; margin: 0 0 .25rem; font-weight: 600; }
  .sub { color: var(--dim); font-size: .8rem; margin-bottom: 1.25rem; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: .7rem; padding: 1rem; margin-bottom: 1rem;
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(7rem, 1fr)); gap: .9rem; }
  .metric .label { font-size: .72rem; color: var(--dim); letter-spacing: .02em; }
  .metric .value { font-size: 1.5rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.2; }
  .metric .value.bad { color: var(--warn); }
  .unit { font-size: .8rem; font-weight: 400; color: var(--dim); margin-left: .1rem; }
  .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: .75rem; }
  .tabs { display: flex; gap: .3rem; }
  .tabs button {
    font: inherit; font-size: .78rem; padding: .25rem .6rem; cursor: pointer;
    background: transparent; color: var(--dim);
    border: 1px solid var(--line); border-radius: .4rem;
  }
  .tabs button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  svg { display: block; width: 100%; height: auto; }
  .legend { display: flex; gap: 1rem; font-size: .75rem; color: var(--dim); margin-top: .5rem; }
  .swatch { display: inline-block; width: .7rem; height: .2rem; vertical-align: middle; margin-right: .3rem; border-radius: 1px; }
  table { width: 100%; border-collapse: collapse; font-size: .85rem; }
  th, td { text-align: left; padding: .35rem 0; border-bottom: 1px solid var(--line); }
  th { font-weight: 400; color: var(--dim); width: 45%; }
  td.bad { color: var(--warn); font-weight: 600; }
  footer { color: var(--dim); font-size: .75rem; text-align: center; margin-top: 1.5rem; }
  .empty { color: var(--dim); font-size: .85rem; text-align: center; padding: 2rem 0; }
  .doses { display: flex; gap: .5rem; }
  .doses button {
    flex: 1; font: inherit; font-size: .9rem; font-weight: 500; padding: .6rem 0;
    cursor: pointer; background: var(--card); color: var(--fg);
    border: 1px solid var(--line); border-radius: .5rem;
  }
  .doses button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .doses button.confirm { background: var(--warn); border-color: var(--warn); color: #fff; }
  .doses button:disabled { opacity: .45; cursor: default; }
  .result { font-size: .85rem; margin-top: .7rem; min-height: 1.2rem; }
  .result.ok { color: var(--water); }
  .result.no { color: var(--warn); }
  .hint { font-size: .78rem; color: var(--dim); margin-top: .4rem; line-height: 1.5; }
  .log { font-size: .8rem; }
  .log-row {
    display: grid; grid-template-columns: 4.2rem 1fr; gap: .6rem;
    padding: .4rem 0; border-bottom: 1px solid var(--line);
  }
  .log-row:last-child { border-bottom: 0; }
  .log-time { color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .log-what .tag {
    display: inline-block; font-size: .68rem; padding: .05rem .35rem; border-radius: .25rem;
    border: 1px solid var(--line); color: var(--dim); margin-right: .35rem; vertical-align: 1px;
  }
  .log-what.ok .tag { border-color: var(--water); color: var(--water); }
  .log-what.no .tag { border-color: var(--warn); color: var(--warn); }
  .log-day { font-size: .72rem; color: var(--dim); padding: .6rem 0 .2rem; font-weight: 600; }
  .cam { position: relative; background: #000; border-radius: .5rem; overflow: hidden; aspect-ratio: 4 / 3; }
  .cam video { width: 100%; height: 100%; display: block; object-fit: contain; background: #000; }
  .cam-msg {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #999; font-size: .85rem; text-align: center; padding: 1rem; line-height: 1.6;
  }
  .cam-bar { display: flex; gap: .5rem; align-items: center; margin-top: .6rem; }
  .cam-bar button {
    font: inherit; font-size: .78rem; padding: .3rem .7rem; cursor: pointer;
    background: var(--card); color: var(--fg); border: 1px solid var(--line); border-radius: .4rem;
  }
  .cam-bar button:hover { border-color: var(--accent); color: var(--accent); }
  .cam-bar .spacer { flex: 1; }
  .live {
    display: inline-flex; align-items: center; gap: .35rem;
    font-size: .72rem; font-weight: 600; letter-spacing: .04em;
    padding: .2rem .5rem; border-radius: .3rem; border: 1px solid;
  }
  .live .dot { width: .4rem; height: .4rem; border-radius: 50%; background: currentColor; }
  .live.on   { color: var(--water); border-color: var(--water); }
  .live.on .dot { animation: pulse 2s ease-in-out infinite; }
  .live.warn { color: #c98a2e; border-color: #c98a2e; }
  .live.err  { color: var(--warn); border-color: var(--warn); }
  .live.off  { color: var(--dim); border-color: var(--line); }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
</style>
</head>
<body>
<h1>나모 파일럿</h1>
<div class="sub" id="sub">불러오는 중…</div>

<div class="card">
  <div class="grid" id="metrics"></div>
</div>

<div class="card">
  <div class="row"><strong style="font-size:.9rem">카메라</strong></div>
  <div class="cam">
    <video id="cam" playsinline muted autoplay preload="auto"></video>
    <div class="cam-msg" id="camMsg">불러오는 중…</div>
  </div>
  <div class="cam-bar">
    <button id="camToggle">재생</button>
    <button id="camSound">소리 켜기</button>
    <button id="camSync" hidden>최신으로</button>
    <span class="spacer"></span>
    <span class="live off" id="camLive"><span class="dot"></span>멈춤</span>
  </div>
  <div class="hint" id="camHint"></div>
</div>

<div class="card">
  <div class="row">
    <strong style="font-size:.9rem">흙 수분</strong>
    <div class="tabs" id="tabs">
      <button data-h="24" aria-pressed="true">24시간</button>
      <button data-h="168" aria-pressed="false">7일</button>
      <button data-h="720" aria-pressed="false">30일</button>
    </div>
  </div>
  <div id="chart"></div>
  <div class="legend">
    <span><span class="swatch" style="background:var(--accent)"></span>흙 수분</span>
    <span><span class="swatch" style="background:var(--water);height:.7rem;width:.2rem"></span>급수</span>
  </div>
</div>

<div class="card">
  <div class="row">
    <strong style="font-size:.9rem">급수</strong>
    <span class="live off" id="waterReady"><span class="dot"></span>확인 중</span>
  </div>
  <div class="doses" id="doses">
    <button data-ml="50">50 mL</button>
    <button data-ml="100">100 mL</button>
    <button data-ml="200">200 mL</button>
  </div>
  <div class="result" id="result"></div>
  <div class="hint" id="waterHint"></div>
  <div class="doses" style="margin-top:.7rem">
    <button id="unlockBtn" disabled>잠금 해제</button>
  </div>
</div>

<div class="card">
  <table id="detail"></table>
</div>

<div class="card">
  <div class="row">
    <strong style="font-size:.9rem">기록</strong>
    <div class="tabs" id="logTabs">
      <button data-n="30" aria-pressed="true">30건</button>
      <button data-n="100" aria-pressed="false">100건</button>
      <button data-n="500" aria-pressed="false">500건</button>
    </div>
  </div>
  <div class="log" id="log"></div>
</div>

<footer>10초마다 갱신됩니다</footer>

<script src="hls.min.js"></script>
<script>
// Caddy가 /namo 접두사를 붙여 넘기기도 하고, 직접 띄워 볼 때는 접두사가
// 없기도 합니다. 지금 주소를 기준으로 API 경로를 만듭니다.
const BASE = location.pathname.replace(/\/stats\/?$/, "").replace(/\/$/, "");
const api = (p) => BASE + p;

let hours = 24;
let lastState = null;
let lastCtx = {};

// 장치가 강제하는 한도. /api/config 에서 받아옵니다. 화면에 숫자를
// 박아두면 장치 쪽을 고쳤을 때 화면이 거짓말을 하게 됩니다.
let limits = { daily_limit_ml: 500, max_dose_ml: 300, cooldown_s: 1800 };

async function loadConfig() {
  try {
    const cfg = await (await fetch(api("/api/config"))).json();
    if (cfg.limits) limits = cfg.limits;
    if (Array.isArray(cfg.allowed_doses) && cfg.allowed_doses.length) {
      document.getElementById("doses").innerHTML = cfg.allowed_doses
        .map((ml) => `<button data-ml="${ml}">${ml} mL</button>`).join("");
    }
  } catch (e) { /* 기본값으로 갑니다 */ }
}

const LABELS = {
  reservoir: "물통", leak: "누수", pump: "펌프", locked: "잠김",
  gateway_online: "게이트웨이", leak_sensors_online: "누수센서 생존",
  today_estimated_ml: "오늘 급수 (mL)", soil_conductivity_us_cm: "전도도 (µS/cm)",
  illuminance_lux: "조도 (lux)", sensor_seen_ago_s: "센서 수신 경과 (초)",
};

const isBad = (k, v) =>
  (k === "leak" && v !== "none") ||
  (k === "reservoir" && v !== "ok") ||
  (k === "locked" && v === true) ||
  (k === "gateway_online" && v !== true) ||
  (k === "leak_sensors_online" && v === false);

function fmt(v) {
  if (v === null || v === undefined) return "—";
  if (v === true) return "예";
  if (v === false) return "아니오";
  return v;
}

async function loadState() {
  const res = await fetch(api("/api/state"));
  if (!res.ok) {
    document.getElementById("sub").textContent = "장치의 텔레메트리를 아직 받지 못했습니다";
    return;
  }
  const { state: s, received_ago_s: ago, context: ctx } = await res.json();
  lastState = s;
  lastCtx = ctx || {};

  document.getElementById("metrics").innerHTML = [
    ["흙 수분", s.soil_moisture_pct, "%"],
    ["온도", s.soil_temperature_c, "℃"],
    ["조도", s.illuminance_lux, "lux"],
    ["오늘 급수", s.today_estimated_ml, "mL"],
  ].map(([label, v, unit]) => `
    <div class="metric">
      <div class="label">${label}</div>
      <div class="value">${fmt(v)}<span class="unit">${v == null ? "" : unit}</span></div>
    </div>`).join("");

  document.getElementById("detail").innerHTML = Object.entries(LABELS)
    .map(([k, label]) => {
      const bad = isBad(k, s[k]);
      return `<tr><th>${label}</th><td class="${bad ? "bad" : ""}">${fmt(s[k])}</td></tr>`;
    }).join("");

  renderWaterReady(s);
  renderWaterHint(s, ctx);

  // 장치가 조용해진 지 오래면 화면의 값이 과거라는 뜻입니다.
  const stale = ago > 60;
  document.getElementById("sub").textContent = stale
    ? `⚠ ${ago}초째 새 값이 없습니다 — 장치가 꺼졌을 수 있습니다`
    : `${ago}초 전 수신`;
}

// 지금 급수가 되는지를 장치와 같은 순서로 따져봅니다.
//
// 최종 판단은 언제나 장치가 합니다. 여기 판정은 미리 보여주기 위한
// 것이고, 헛되이 눌러놓고 거부 사유를 읽는 대신 누르기 전에 알기
// 위한 것입니다. 순서는 namo-core 의 evaluate() 를 따릅니다.
function waterStatus(s) {
  if (!s) return { ok: false, why: "상태를 받지 못함" };
  if (s.locked) return { ok: false, why: "누수로 잠김" };
  if (s.pump === "running") return { ok: false, why: "급수 중" };
  if (s.leak === "detected") return { ok: false, why: "누수 감지됨" };
  if (s.leak !== "none") return { ok: false, why: "누수 상태를 모름" };
  if (s.reservoir === "empty") return { ok: false, why: "물통 비었음" };
  if (s.reservoir !== "ok") return { ok: false, why: "물통 상태를 모름" };

  const now = Math.floor(Date.now() / 1000);
  if (s.cooldown_until && s.cooldown_until > now) {
    return { ok: false, soon: true, why: `쿨다운 ${fmtDur(s.cooldown_until - now)}` };
  }
  if (typeof s.today_estimated_ml === "number" && s.today_estimated_ml >= limits.daily_limit_ml) {
    return { ok: false, why: "오늘 한도 소진" };
  }
  return { ok: true, why: "가능" };
}

function renderWaterReady(s) {
  const el = document.getElementById("waterReady");
  const st = waterStatus(s);

  el.className = `live ${st.ok ? "on" : st.soon ? "warn" : "err"}`;
  el.innerHTML = `<span class="dot"></span>${st.ok ? "가능" : st.why}`;

  // 잠금 해제는 잠겼을 때만 누를 수 있습니다. 평소에도 보이게 두는 것은
  // 이런 수단이 있다는 것 자체를 알아야 하기 때문입니다.
  if (!unlockBusy) {
    unlockBtn.disabled = !s.locked;
    if (!s.locked) disarmUnlock();
  }

  // 확인을 기다리는 중이 아니고 진행 중도 아닐 때만 잠급니다.
  if (!busy && !armed) {
    for (const b of document.querySelectorAll("#doses button")) {
      b.disabled = !st.ok;
      // 한도가 모자라면 그 버튼만 막습니다.
      if (st.ok && typeof s.today_estimated_ml === "number") {
        b.disabled = s.today_estimated_ml + Number(b.dataset.ml) > limits.daily_limit_ml;
      }
    }
  }
}

// 급수 카드 아래에 "지금 왜 이런 상태인지"를 씁니다.
//
// 쿨다운이면 언제 풀리는지, 직전에 언제 얼마나 줬는지까지 보여야
// 기다릴지 말지 판단할 수 있습니다.
function renderWaterHint(s, ctx = {}) {
  const el = document.getElementById("waterHint");
  const lines = [];
  const now = Math.floor(Date.now() / 1000);

  if (s.cooldown_until && s.cooldown_until > now) {
    lines.push(`🕒 쿨다운 <b>${fmtDur(s.cooldown_until - now)}</b> 남음 (${fmtTime(s.cooldown_until)}에 풀림)`);
  }
  const lw = ctx.last_watering;
  if (lw) {
    const via = lw.source === "web" ? " · 웹에서" : "";
    lines.push(`마지막 급수 <b>${lw.ml}mL</b> — ${fmtTime(lw.ts)} (${fmtAgo(lw.ts)})${via}`);
  }
  // 지난 실패는 최근 것만 보여줍니다. 한참 전에 거부된 기록이 지금도
  // 막혀 있는 것처럼 읽히면 오히려 헷갈립니다. 자세한 내역은 아래
  // 기록 카드에 다 있습니다.
  const la = ctx.last_attempt;
  if (la && la.status !== "completed" && now - la.ts < 600) {
    const why = REASONS[la.reason] || la.reason || "";
    lines.push(`직전 시도 <b>${STATUS_LABEL[la.status] || la.status}</b> — ${why} (${fmtAgo(la.ts)})`);
  }

  // 오늘 얼마나 남았는지. 한도는 /api/config 에서 받아옵니다.
  if (typeof s.today_estimated_ml === "number") {
    lines.push(`오늘 ${s.today_estimated_ml}mL / ${limits.daily_limit_ml}mL · 남은 한도 <b>${Math.max(0, limits.daily_limit_ml - s.today_estimated_ml)}mL</b>`);
  }

  if (s.reservoir !== "ok" && ctx.reservoir_empty_since) {
    lines.push(`⚠ 물통이 ${fmtAgo(ctx.reservoir_empty_since)}부터 비어 있습니다`);
  }
  if (s.locked && ctx.locked_since) {
    lines.push(`🔒 ${fmtAgo(ctx.locked_since)}부터 잠김 — unlock 명령으로만 풀립니다`);
  }
  if (s.gateway_online === false && ctx.gateway_lost_at) {
    lines.push(`⚠ 게이트웨이가 ${fmtAgo(ctx.gateway_lost_at)}부터 끊겨 급수가 거부됩니다`);
  }

  el.innerHTML = lines.join("<br>");
}

// 사건 한 줄을 사람 말로 바꿉니다.
function describe(e) {
  const v = (x) => VALUE_LABEL[x] ?? x;

  if (e.k === "water") {
    const tag = STATUS_LABEL[e.status] || e.status;
    if (e.status === "completed") {
      return { cls: "ok", tag, text: `${e.ml}mL${e.pms ? ` · ${(e.pms / 1000).toFixed(1)}초` : ""}${e.src === "web" ? " · 웹" : ""}` };
    }
    const why = REASONS[e.r] || e.r || "";
    const extra = e.ml ? ` (${e.ml}mL 나감)` : "";
    return { cls: "no", tag, text: `${why}${extra}` };
  }
  if (e.k === "gateway" && String(e.f).startsWith("sensors:")) {
    const to = String(e.t).replace("sensors:", "");
    return { cls: to === "true" ? "ok" : "no", tag: "누수센서", text: to === "true" ? "살아남" : "응답 없음" };
  }

  const label = KIND_LABEL[e.k] || e.k;
  const to = v(e.t);
  const bad =
    (e.k === "reservoir" && e.t !== "ok") ||
    (e.k === "leak" && e.t !== "none") ||
    (e.k === "lock" && e.t === "true") ||
    (e.k === "gateway" && e.t === "false") ||
    (e.k === "device" && e.t === "offline");
  const from = e.f ? `${v(e.f)} → ` : "";
  return { cls: bad ? "no" : "ok", tag: label, text: `${from}${to}` };
}

let logLimit = 30;

async function loadLog() {
  const res = await fetch(api(`/api/events?limit=${logLimit}`));
  const events = (await res.json()) || [];
  const el = document.getElementById("log");

  if (!events.length) {
    el.innerHTML = `<div class="empty">아직 기록이 없습니다</div>`;
    return;
  }

  let day = null;
  el.innerHTML = events.map((e) => {
    const d = describe(e);
    const thisDay = fmtDay(e.ts);
    const header = thisDay !== day ? `<div class="log-day">${thisDay}</div>` : "";
    day = thisDay;
    return `${header}<div class="log-row">
      <div class="log-time">${fmtTime(e.ts)}</div>
      <div class="log-what ${d.cls}"><span class="tag">${d.tag}</span>${d.text}</div>
    </div>`;
  }).join("");
}

document.getElementById("logTabs").addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  logLimit = Number(btn.dataset.n);
  for (const b of document.querySelectorAll("#logTabs button")) {
    b.setAttribute("aria-pressed", String(b === btn));
  }
  loadLog();
});

async function loadChart() {
  const res = await fetch(api(`/api/history?hours=${hours}`));
  const samples = await res.json();
  drawChart(samples || []);
}

function drawChart(samples) {
  const el = document.getElementById("chart");
  const pts = samples.filter((s) => s.m != null);
  const waters = samples.filter((s) => s.w > 0);

  if (pts.length < 2) {
    el.innerHTML = `<div class="empty">아직 그릴 만큼 쌓이지 않았습니다</div>`;
    return;
  }

  const W = 700, H = 220, PL = 34, PR = 8, PT = 10, PB = 22;
  const t0 = Math.min(...samples.map((s) => s.ts));
  const t1 = Math.max(...samples.map((s) => s.ts));
  const span = Math.max(t1 - t0, 1);

  const x = (ts) => PL + ((ts - t0) / span) * (W - PL - PR);
  const y = (v) => PT + (1 - v / 100) * (H - PT - PB);

  const line = pts.map((s, i) => `${i ? "L" : "M"}${x(s.ts).toFixed(1)},${y(s.m).toFixed(1)}`).join("");
  const area = `${line}L${x(pts[pts.length - 1].ts).toFixed(1)},${y(0)}L${x(pts[0].ts).toFixed(1)},${y(0)}Z`;

  const grid = [0, 25, 50, 75, 100].map((v) => `
    <line x1="${PL}" y1="${y(v)}" x2="${W - PR}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/>
    <text x="${PL - 6}" y="${y(v) + 3.5}" text-anchor="end" font-size="10" fill="var(--dim)">${v}</text>`).join("");

  // 급수는 세로선으로 표시합니다. 물을 준 뒤 얼마나 올랐는지가 한눈에
  // 보여야 급수량과 주기를 판단할 수 있습니다.
  const marks = waters.map((s) => `
    <line x1="${x(s.ts).toFixed(1)}" y1="${PT}" x2="${x(s.ts).toFixed(1)}" y2="${H - PB}"
          stroke="var(--water)" stroke-width="1.5" stroke-dasharray="3 2" opacity=".8"/>`).join("");

  const ticks = [0, 0.5, 1].map((f) => {
    const ts = t0 + span * f;
    const d = new Date(ts * 1000);
    const label = hours <= 24
      ? `${d.getHours()}시`
      : `${d.getMonth() + 1}/${d.getDate()}`;
    const anchor = f === 0 ? "start" : f === 1 ? "end" : "middle";
    return `<text x="${x(ts).toFixed(1)}" y="${H - 6}" text-anchor="${anchor}" font-size="10" fill="var(--dim)">${label}</text>`;
  }).join("");

  el.innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="흙 수분 추이">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="var(--accent)" stop-opacity=".22"/>
          <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
        </linearGradient>
      </defs>
      ${grid}${marks}
      <path d="${area}" fill="url(#g)"/>
      <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2"
            stroke-linejoin="round" stroke-linecap="round"/>
      ${ticks}
    </svg>`;
}

// 거부 사유는 장치가 정한 문자열입니다. 그대로 보여주면 무슨 일인지
// 알기 어려우므로 사람 말로 바꿉니다.
const REASONS = {
  cooldown: "쿨다운 중입니다. 조금 뒤에 다시 하세요",
  daily_limit: "오늘 한도를 다 썼습니다",
  reservoir_empty: "물통이 비었습니다",
  reservoir_unknown: "물통 상태를 모릅니다",
  leak_detected: "누수가 감지됐습니다",
  leak_stale: "누수 상태를 믿을 수 없습니다",
  locked: "누수로 잠겨 있습니다",
  dose_too_large: "요청량이 상한을 넘습니다",
  already_running: "이미 급수 중입니다",
  clock_unsynced: "장치 시각이 맞춰지지 않았습니다",
};

// 사람이 읽을 수 있게 바꾸는 표들.
const KIND_LABEL = {
  water: "급수", reservoir: "물통", leak: "누수",
  lock: "잠금", gateway: "게이트웨이", device: "장치",
};
const STATUS_LABEL = { completed: "완료", rejected: "거부", aborted: "중단" };
const VALUE_LABEL = {
  ok: "정상", empty: "비었음", unknown: "모름",
  none: "없음", detected: "감지됨",
  true: "예", false: "아니오",
  online: "연결됨", offline: "끊김",
};

const fmtTime = (ts) => {
  const d = new Date(ts * 1000);
  return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
};
const fmtDay = (ts) => {
  const d = new Date(ts * 1000);
  const today = new Date();
  const same = d.toDateString() === today.toDateString();
  const yday = new Date(today.getTime() - 86400000).toDateString() === d.toDateString();
  if (same) return "오늘";
  if (yday) return "어제";
  return `${d.getMonth() + 1}월 ${d.getDate()}일`;
};
// "3분 전", "2시간 전"처럼 지금으로부터 얼마나 됐는지.
const fmtAgo = (ts) => {
  const s = Math.max(0, Math.floor(Date.now() / 1000) - ts);
  if (s < 60) return `${s}초 전`;
  if (s < 3600) return `${Math.floor(s / 60)}분 전`;
  if (s < 86400) return `${Math.floor(s / 3600)}시간 ${Math.floor((s % 3600) / 60)}분 전`;
  return `${Math.floor(s / 86400)}일 전`;
};
const fmtDur = (s) => {
  s = Math.max(0, Math.round(s));
  if (s < 60) return `${s}초`;
  const m = Math.floor(s / 60);
  if (m < 60) return `${m}분 ${s % 60}초`;
  return `${Math.floor(m / 60)}시간 ${m % 60}분`;
};

const resultEl = document.getElementById("result");
let armed = null;   // 확인을 기다리는 버튼
let busy = false;

function setDosesDisabled(v) {
  for (const b of document.querySelectorAll("#doses button")) b.disabled = v;
}

function disarm() {
  if (!armed) return;
  armed.classList.remove("confirm");
  armed.textContent = armed.dataset.ml + " mL";
  armed = null;
}

// 잠금은 누수를 본 뒤에만 걸립니다. 원인을 확인하지 않고 푸는 것은
// 물이 새는 채로 급수를 다시 여는 것과 같아서, 한 번 더 묻습니다.
const unlockBtn = document.getElementById("unlockBtn");
let unlockArmed = false;
let unlockBusy = false;

function disarmUnlock() {
  if (!unlockArmed) return;
  unlockArmed = false;
  unlockBtn.classList.remove("confirm");
  unlockBtn.textContent = "잠금 해제";
}

unlockBtn.addEventListener("click", async () => {
  if (!unlockArmed) {
    unlockArmed = true;
    unlockBtn.classList.add("confirm");
    unlockBtn.textContent = "누수 원인 확인했음?";
    resultEl.className = "result";
    resultEl.textContent = "한 번 더 누르면 잠금이 풀립니다";
    return;
  }

  unlockArmed = false;
  unlockBusy = true;
  unlockBtn.classList.remove("confirm");
  unlockBtn.textContent = "해제 중…";
  unlockBtn.disabled = true;
  resultEl.className = "result";
  resultEl.textContent = "";

  try {
    const res = await fetch(api("/api/unlock"), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: "{}",
    });
    const data = await res.json();
    if (res.ok && data.locked === false) {
      resultEl.className = "result ok";
      resultEl.textContent = data.note || "잠금이 풀렸습니다";
    } else {
      resultEl.className = "result no";
      resultEl.textContent = data.error || "풀지 못했습니다";
    }
  } catch (e) {
    resultEl.className = "result no";
    resultEl.textContent = "요청을 보내지 못했습니다";
  } finally {
    unlockBusy = false;
    unlockBtn.textContent = "잠금 해제";
    tick();
  }
});

// 다른 곳을 누르면 확인 상태를 풉니다.
document.addEventListener("click", (e) => {
  if (e.target !== unlockBtn) disarmUnlock();
});

document.getElementById("doses").addEventListener("click", async (e) => {
  const btn = e.target.closest("button");
  if (!btn || busy) return;

  // 물은 되돌릴 수 없으므로 한 번 더 묻습니다.
  if (armed !== btn) {
    disarm();
    armed = btn;
    btn.classList.add("confirm");
    btn.textContent = "정말?";
    resultEl.className = "result";
    resultEl.textContent = "한 번 더 누르면 물이 나갑니다";
    return;
  }

  const ml = Number(btn.dataset.ml);
  disarm();
  busy = true;
  setDosesDisabled(true);
  resultEl.className = "result";
  resultEl.textContent = `${ml}mL 요청 중…`;

  try {
    const res = await fetch(api("/api/water"), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ dose_ml: ml }),
    });
    const data = await res.json();

    if (!res.ok) {
      resultEl.className = "result no";
      resultEl.textContent = data.error || `실패 (HTTP ${res.status})`;
    } else if (data.status === "completed") {
      resultEl.className = "result ok";
      resultEl.textContent = `${data.estimated_ml}mL 나갔습니다`;
    } else if (data.status === "aborted") {
      resultEl.className = "result no";
      resultEl.textContent = `중단됨 — ${REASONS[data.reason] || data.reason} (${data.estimated_ml}mL 나감)`;
    } else {
      resultEl.className = "result no";
      resultEl.textContent = REASONS[data.reason] || data.reason || "거부됐습니다";
      // 거부된 이유의 배경을 바로 아래에 펼칩니다.
      if (data.context) renderWaterHint(lastState || {}, data.context);
    }
  } catch (err) {
    resultEl.className = "result no";
    resultEl.textContent = "요청을 보내지 못했습니다";
  } finally {
    busy = false;
    setDosesDisabled(false);
    tick();
  }
});

// 다른 곳을 누르면 확인 상태를 풉니다.
document.addEventListener("click", (e) => {
  if (!e.target.closest("#doses")) disarm();
});

// ── 카메라 ─────────────────────────────────────────────────────────
//
// 맥에 물린 USB 웹캠을 ffmpeg이 HLS로 흘려보내고, Caddy가 /namo/cam 으로
// 넘겨줍니다. 사파리는 HLS를 직접 재생하고, 나머지는 hls.js가 필요합니다.
//
// 자동으로 재생하지 않습니다. 화면을 열어두기만 해도 계속 받으면 맥과
// 대역폭을 헛되이 쓰기 때문입니다. 볼 때만 누르는 편이 낫습니다.
const CAM_SRC = api("/cam/stream.m3u8");
const video = document.getElementById("cam");
const camMsg = document.getElementById("camMsg");
const camLive = document.getElementById("camLive");
const camHint = document.getElementById("camHint");
const camToggle = document.getElementById("camToggle");
const camSync = document.getElementById("camSync");
let hls = null;
let camOn = false;
let camErr = null;
let lastPos = -1;
let stuckFor = 0;

// 끊긴 스트림에 다시 붙습니다. 카메라 쪽이 재시작하면 세그먼트 번호가
// 건너뛰므로, 붙잡고 있던 재생기를 버리고 새로 여는 편이 빠릅니다.
async function camRestart() {
  if (hls) { hls.destroy(); hls = null; }
  video.removeAttribute("src");
  video.load();
  lastPos = -1;
  stuckFor = 0;
  await camStart();
}

let retryTimer = null;
let pendingPlay = false;

// 브라우저가 자동 재생을 막는 경우가 있습니다. 그때는 다음 클릭·터치
// 한 번에 이어붙입니다. 사용자가 "재생"을 찾아 누르지 않아도 되게.
function playSoon() {
  if (pendingPlay) return;
  pendingPlay = true;
  const go = () => {
    pendingPlay = false;
    document.removeEventListener("click", go);
    document.removeEventListener("touchstart", go);
    document.removeEventListener("keydown", go);
    if (camOn) video.play().catch(() => {});
  };
  document.addEventListener("click", go, { once: true });
  document.addEventListener("touchstart", go, { once: true });
  document.addEventListener("keydown", go, { once: true });
}

function camSay(text) {
  camMsg.textContent = text || "";
  camMsg.style.display = text ? "flex" : "none";
}

// 배지 하나로 지금 상태를 말합니다. 라이브 스트림에서 경과 시간은
// 의미가 없고, 정작 알아야 할 것은 "지금 최신을 보고 있는가"입니다.
function setLive(cls, label, hint = "") {
  camLive.className = `live ${cls}`;
  camLive.innerHTML = `<span class="dot"></span>${label}`;
  camHint.textContent = hint;
  camSync.hidden = cls !== "warn" || !camOn;
}

// 지금 화면이 최신에서 얼마나 뒤처져 있는지(초).
// 모르면 null입니다.
function camLatency() {
  if (hls && typeof hls.latency === "number" && hls.latency > 0) return hls.latency;
  try {
    const n = video.seekable.length;
    if (n > 0) return Math.max(0, video.seekable.end(n - 1) - video.currentTime);
  } catch (e) { /* 아직 읽을 수 없습니다 */ }
  return null;
}

function camJumpToLive() {
  try {
    const n = video.seekable.length;
    if (n > 0) video.currentTime = video.seekable.end(n - 1) - 0.5;
    video.play().catch(() => {});
  } catch (e) { /* 무시 */ }
}

function camStop() {
  camOn = false;
  camErr = null;
  clearTimeout(retryTimer);
  lastPos = -1;
  stuckFor = 0;
  if (hls) { hls.destroy(); hls = null; }
  video.removeAttribute("src");
  video.load();
  camToggle.textContent = "재생";
  setLive("off", "멈춤");
  camSay("멈춤 — 재생을 누르면 이어집니다");
}

async function camStart() {
  camOn = true;
  camErr = null;
  camToggle.textContent = "멈춤";
  camSay("연결 중…");
  setLive("warn", "연결 중");

  // 스트림이 살아 있는지 먼저 확인합니다. 재생기가 뱉는 오류는 원인을
  // 가리지 않아서, 카메라가 꺼진 것인지 네트워크가 끊긴 것인지를
  // 여기서 구분해 알려줍니다.
  try {
    const probe = await fetch(CAM_SRC, { cache: "no-store" });
    if (probe.status === 404) {
      camErr = "카메라가 꺼져 있습니다";
      setLive("err", "꺼짐", "맥에서 ./scripts/cam.sh 를 실행하세요");
      camSay("카메라가 꺼져 있습니다");
      camOn = false;
      camToggle.textContent = "재생";
      return;
    }
    if (!probe.ok) throw new Error(String(probe.status));
  } catch (e) {
    camErr = "스트림에 닿지 못했습니다";
    setLive("err", "연결 실패", "맥이 켜져 있고 cam.sh 가 도는지 확인하세요");
    camSay("스트림에 닿지 못했습니다");
    camOn = false;
    camToggle.textContent = "재생";
    return;
  }

  // 사파리는 HLS를 네이티브로 재생합니다. hls.js를 쓰면 오히려 충돌합니다.
  if (video.canPlayType("application/vnd.apple.mpegurl")) {
    video.src = CAM_SRC;
    try {
      await video.play();
      camSay("");
    } catch (e) {
      // 자동 재생이 막혔습니다. 화면은 띄워두고 다음 터치에 시작합니다.
      camSay("");
      setLive("warn", "일시정지", "화면을 한 번 누르면 시작됩니다");
      playSoon();
    }
    return;
  }

  if (!window.Hls || !Hls.isSupported()) {
    camSay("이 브라우저는 HLS를 재생하지 못합니다");
    setLive("err", "미지원", "사파리나 크롬에서 열어보세요");
    return;
  }

  hls = new Hls({
    // 늦게 들어와도 항상 최신 지점을 따라가게 합니다. 오래 열어두면
    // 조금씩 밀려서 몇 분 전 화면을 보게 되는 것을 막습니다.
    liveSyncDurationCount: 2,
    liveMaxLatencyDurationCount: 5,
    lowLatencyMode: true,
    backBufferLength: 10,
  });
  hls.loadSource(CAM_SRC);
  hls.attachMedia(video);

  hls.on(Hls.Events.MANIFEST_PARSED, () => {
    video.play().then(() => {
      camSay("");
      camErr = null;
    }).catch(() => {
      camSay("");
      setLive("warn", "일시정지", "화면을 한 번 누르면 시작됩니다");
      playSoon();
    });
  });

  hls.on(Hls.Events.FRAG_LOADED, () => {
    camErr = null;
    clearTimeout(retryTimer);
  });

  hls.on(Hls.Events.ERROR, (_, data) => {
    if (!data.fatal) return;
    // 카메라 쪽이 잠깐 끊긴 것일 수 있으니 한 번은 복구를 시도합니다.
    if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
      camErr = "스트림이 끊겼습니다";
      setLive("err", "끊김", "다시 붙는 중입니다");
      // 카메라가 돌아오면 저절로 이어지도록 계속 두드립니다.
      hls.startLoad();
      clearTimeout(retryTimer);
      retryTimer = setTimeout(() => { if (camOn) camRestart(); }, 5000);
    } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
      camErr = "영상을 복구하는 중";
      setLive("warn", "복구 중", "잠시만 기다려주세요");
      hls.recoverMediaError();
    } else {
      camStop();
      camSay("재생할 수 없습니다");
      setLive("err", "오류", data.details || "");
    }
  });
}

camToggle.addEventListener("click", () => (camOn ? camStop() : camStart()));
camSync.addEventListener("click", camJumpToLive);

// 화면을 눌러도 재생·정지가 되게 합니다. 기본 컨트롤을 뺐기 때문입니다.
video.addEventListener("click", () => {
  if (!camOn) return camStart();
  if (video.paused) video.play().catch(() => {});
  else video.pause();
});

// 배지를 1초마다 갱신합니다. 얼마나 뒤처졌는지는 계속 변합니다.
setInterval(() => {
  // 쿨다운은 초 단위로 줄어들고, 다 되면 바로 "가능"으로 바뀌어야
  // 합니다. 10초 주기 갱신만 기다리면 지난 뒤에도 막힌 것처럼 보입니다.
  if (lastState) {
    renderWaterReady(lastState);
    renderWaterHint(lastState, lastCtx);
  }

  if (!camOn) return;
  if (camErr) return;              // 오류 표시를 덮어쓰지 않습니다.
  if (video.paused) {
    setLive("warn", "일시정지", "화면을 누르면 이어집니다");
    return;
  }
  // 화면이 멈춘 채로 시간만 흐르는 경우를 잡습니다. 재생 중이라고
  // 표시되지만 실제로는 진행하지 않는 상태입니다.
  if (video.currentTime === lastPos) {
    stuckFor += 1;
    if (stuckFor === 6) {
      setLive("warn", "복구 중", "화면이 멈춰 다시 붙는 중입니다");
    } else if (stuckFor >= 12) {
      // 오래 멈춰 있으면 통째로 다시 엽니다. 카메라 쪽이 재시작하면
      // 세그먼트 번호가 건너뛰어, 붙잡고 있던 재생기는 못 따라옵니다.
      stuckFor = 0;
      camRestart();
      return;
    }
  } else {
    stuckFor = 0;
    lastPos = video.currentTime;
  }

  const lat = camLatency();
  if (lat === null) {
    setLive("warn", "버퍼링");
  } else if (lat > 12) {
    // 오래 열어두면 조금씩 밀립니다. 따라잡을 수단을 함께 줍니다.
    setLive("warn", `${Math.round(lat)}초 지연`, "최신으로를 누르면 따라잡습니다");
  } else {
    setLive("on", "LIVE", `지연 ${lat.toFixed(1)}초`);
  }
}, 1000);

document.getElementById("camSound").addEventListener("click", (e) => {
  video.muted = !video.muted;
  e.target.textContent = video.muted ? "소리 켜기" : "소리 끄기";
  // 브라우저는 사용자가 누르기 전에는 소리를 허용하지 않습니다.
  if (!video.muted && video.paused && camOn) video.play().catch(() => {});
});

// 탭을 떠나면 받기를 멈추고, 돌아오면 다시 붙습니다. 보지 않는 동안
// 계속 받으면 맥과 대역폭을 헛되이 씁니다.
document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    if (camOn) camStop();
  } else if (!camOn) {
    camStart();
  }
});

// 화면을 열면 바로 틀어줍니다.
//
// 소리는 음소거로 시작합니다. 브라우저는 소리가 나는 영상을 사용자가
// 누르기 전에 재생하지 못하게 막습니다. 음소거면 허용되므로, 소리는
// 버튼으로 켜게 둡니다.
setLive("off", "멈춤");
camSay("연결 중…");
camStart();

// 한도와 버튼 구성을 받아온 뒤 첫 화면을 그립니다.
loadConfig().then(tick);

async function tick() {
  try {
    await Promise.all([loadState(), loadChart(), loadLog()]);
  } catch (e) {
    // 한 번 실패해도 다음 주기에 다시 시도합니다.
  }
}

tick();
setInterval(tick, 10000);
</script>
</body>
</html>
