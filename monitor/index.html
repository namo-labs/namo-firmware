<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>나모 파일럿</title>
<style>
  :root {
    --bg: #fbfbfa; --card: #fff; --fg: #1a1a18; --dim: #6b6b66;
    --line: #e4e4e0; --accent: #2d7dd2; --water: #3aa76d; --warn: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614; --card: #201e1c; --fg: #ece9e4; --dim: #98938c;
      --line: #322f2c; --accent: #63a4e8; --water: #55c98a; --warn: #e8705f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 1.25rem 1rem 3rem; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    line-height: 1.5; max-width: 46rem; margin-inline: auto;
  }
  h1 { font-size: 1.1rem; margin: 0 0 .25rem; font-weight: 600; }
  .sub { color: var(--dim); font-size: .8rem; margin-bottom: 1.25rem; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: .7rem; padding: 1rem; margin-bottom: 1rem;
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(7rem, 1fr)); gap: .9rem; }
  .metric .label { font-size: .72rem; color: var(--dim); letter-spacing: .02em; }
  .metric .value { font-size: 1.5rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.2; }
  .metric .value.bad { color: var(--warn); }
  .unit { font-size: .8rem; font-weight: 400; color: var(--dim); margin-left: .1rem; }
  .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: .75rem; }
  .tabs { display: flex; gap: .3rem; }
  .tabs button {
    font: inherit; font-size: .78rem; padding: .25rem .6rem; cursor: pointer;
    background: transparent; color: var(--dim);
    border: 1px solid var(--line); border-radius: .4rem;
  }
  .tabs button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  svg { display: block; width: 100%; height: auto; }
  .legend { display: flex; gap: 1rem; font-size: .75rem; color: var(--dim); margin-top: .5rem; }
  .swatch { display: inline-block; width: .7rem; height: .2rem; vertical-align: middle; margin-right: .3rem; border-radius: 1px; }
  table { width: 100%; border-collapse: collapse; font-size: .85rem; }
  th, td { text-align: left; padding: .35rem 0; border-bottom: 1px solid var(--line); }
  th { font-weight: 400; color: var(--dim); width: 45%; }
  td.bad { color: var(--warn); font-weight: 600; }
  footer { color: var(--dim); font-size: .75rem; text-align: center; margin-top: 1.5rem; }
  .empty { color: var(--dim); font-size: .85rem; text-align: center; padding: 2rem 0; }
  .doses { display: flex; gap: .5rem; }
  .doses button {
    flex: 1; font: inherit; font-size: .9rem; font-weight: 500; padding: .6rem 0;
    cursor: pointer; background: var(--card); color: var(--fg);
    border: 1px solid var(--line); border-radius: .5rem;
  }
  .doses button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .doses button.confirm { background: var(--warn); border-color: var(--warn); color: #fff; }
  .doses button:disabled { opacity: .45; cursor: default; }
  .result { font-size: .85rem; margin-top: .7rem; min-height: 1.2rem; }
  .result.ok { color: var(--water); }
  .result.no { color: var(--warn); }
  .hint { font-size: .78rem; color: var(--dim); margin-top: .4rem; line-height: 1.5; }
  .log { font-size: .8rem; }
  .log-row {
    display: grid; grid-template-columns: 4.2rem 1fr; gap: .6rem;
    padding: .4rem 0; border-bottom: 1px solid var(--line);
  }
  .log-row:last-child { border-bottom: 0; }
  .log-time { color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .log-what .tag {
    display: inline-block; font-size: .68rem; padding: .05rem .35rem; border-radius: .25rem;
    border: 1px solid var(--line); color: var(--dim); margin-right: .35rem; vertical-align: 1px;
  }
  .log-what.ok .tag { border-color: var(--water); color: var(--water); }
  .log-what.no .tag { border-color: var(--warn); color: var(--warn); }
  .log-day { font-size: .72rem; color: var(--dim); padding: .6rem 0 .2rem; font-weight: 600; }
</style>
</head>
<body>
<h1>나모 파일럿</h1>
<div class="sub" id="sub">불러오는 중…</div>

<div class="card">
  <div class="grid" id="metrics"></div>
</div>

<div class="card">
  <div class="row">
    <strong style="font-size:.9rem">흙 수분</strong>
    <div class="tabs" id="tabs">
      <button data-h="24" aria-pressed="true">24시간</button>
      <button data-h="168" aria-pressed="false">7일</button>
      <button data-h="720" aria-pressed="false">30일</button>
    </div>
  </div>
  <div id="chart"></div>
  <div class="legend">
    <span><span class="swatch" style="background:var(--accent)"></span>흙 수분</span>
    <span><span class="swatch" style="background:var(--water);height:.7rem;width:.2rem"></span>급수</span>
  </div>
</div>

<div class="card">
  <div class="row"><strong style="font-size:.9rem">급수</strong></div>
  <div class="doses" id="doses">
    <button data-ml="50">50 mL</button>
    <button data-ml="100">100 mL</button>
    <button data-ml="200">200 mL</button>
  </div>
  <div class="result" id="result"></div>
  <div class="hint" id="waterHint"></div>
</div>

<div class="card">
  <table id="detail"></table>
</div>

<div class="card">
  <div class="row">
    <strong style="font-size:.9rem">기록</strong>
    <div class="tabs" id="logTabs">
      <button data-n="30" aria-pressed="true">30건</button>
      <button data-n="100" aria-pressed="false">100건</button>
      <button data-n="500" aria-pressed="false">500건</button>
    </div>
  </div>
  <div class="log" id="log"></div>
</div>

<footer>10초마다 갱신됩니다</footer>

<script>
// Caddy가 /namo 접두사를 붙여 넘기기도 하고, 직접 띄워 볼 때는 접두사가
// 없기도 합니다. 지금 주소를 기준으로 API 경로를 만듭니다.
const BASE = location.pathname.replace(/\/stats\/?$/, "").replace(/\/$/, "");
const api = (p) => BASE + p;

let hours = 24;
let lastState = null;

const LABELS = {
  reservoir: "물통", leak: "누수", pump: "펌프", locked: "잠김",
  gateway_online: "게이트웨이", leak_sensors_online: "누수센서 생존",
  today_estimated_ml: "오늘 급수 (mL)", soil_conductivity_us_cm: "전도도 (µS/cm)",
  illuminance_lux: "조도 (lux)", sensor_seen_ago_s: "센서 수신 경과 (초)",
};

const isBad = (k, v) =>
  (k === "leak" && v !== "none") ||
  (k === "reservoir" && v !== "ok") ||
  (k === "locked" && v === true) ||
  (k === "gateway_online" && v !== true) ||
  (k === "leak_sensors_online" && v === false);

function fmt(v) {
  if (v === null || v === undefined) return "—";
  if (v === true) return "예";
  if (v === false) return "아니오";
  return v;
}

async function loadState() {
  const res = await fetch(api("/api/state"));
  if (!res.ok) {
    document.getElementById("sub").textContent = "장치의 텔레메트리를 아직 받지 못했습니다";
    return;
  }
  const { state: s, received_ago_s: ago, context: ctx } = await res.json();
  lastState = s;

  document.getElementById("metrics").innerHTML = [
    ["흙 수분", s.soil_moisture_pct, "%"],
    ["온도", s.soil_temperature_c, "℃"],
    ["조도", s.illuminance_lux, "lux"],
    ["오늘 급수", s.today_estimated_ml, "mL"],
  ].map(([label, v, unit]) => `
    <div class="metric">
      <div class="label">${label}</div>
      <div class="value">${fmt(v)}<span class="unit">${v == null ? "" : unit}</span></div>
    </div>`).join("");

  document.getElementById("detail").innerHTML = Object.entries(LABELS)
    .map(([k, label]) => {
      const bad = isBad(k, s[k]);
      return `<tr><th>${label}</th><td class="${bad ? "bad" : ""}">${fmt(s[k])}</td></tr>`;
    }).join("");

  renderWaterHint(s, ctx);

  // 장치가 조용해진 지 오래면 화면의 값이 과거라는 뜻입니다.
  const stale = ago > 60;
  document.getElementById("sub").textContent = stale
    ? `⚠ ${ago}초째 새 값이 없습니다 — 장치가 꺼졌을 수 있습니다`
    : `${ago}초 전 수신`;
}

// 급수 카드 아래에 "지금 왜 이런 상태인지"를 씁니다.
//
// 쿨다운이면 언제 풀리는지, 직전에 언제 얼마나 줬는지까지 보여야
// 기다릴지 말지 판단할 수 있습니다.
function renderWaterHint(s, ctx = {}) {
  const el = document.getElementById("waterHint");
  const lines = [];
  const now = Math.floor(Date.now() / 1000);

  if (s.cooldown_until && s.cooldown_until > now) {
    lines.push(`🕒 쿨다운 <b>${fmtDur(s.cooldown_until - now)}</b> 남음 (${fmtTime(s.cooldown_until)}에 풀림)`);
  }
  const lw = ctx.last_watering;
  if (lw) {
    const via = lw.source === "web" ? " · 웹에서" : "";
    lines.push(`마지막 급수 <b>${lw.ml}mL</b> — ${fmtTime(lw.ts)} (${fmtAgo(lw.ts)})${via}`);
  }
  const la = ctx.last_attempt;
  if (la && la.status !== "completed") {
    const why = REASONS[la.reason] || la.reason || "";
    lines.push(`마지막 시도 <b>${STATUS_LABEL[la.status] || la.status}</b> — ${why} (${fmtAgo(la.ts)})`);
  }

  // 오늘 얼마나 남았는지. 일일 한도는 장치가 500mL로 잡고 있습니다.
  if (typeof s.today_estimated_ml === "number") {
    lines.push(`오늘 ${s.today_estimated_ml}mL / 500mL · 남은 한도 <b>${Math.max(0, 500 - s.today_estimated_ml)}mL</b>`);
  }

  if (s.reservoir !== "ok" && ctx.reservoir_empty_since) {
    lines.push(`⚠ 물통이 ${fmtAgo(ctx.reservoir_empty_since)}부터 비어 있습니다`);
  }
  if (s.locked && ctx.locked_since) {
    lines.push(`🔒 ${fmtAgo(ctx.locked_since)}부터 잠김 — unlock 명령으로만 풀립니다`);
  }
  if (s.gateway_online === false && ctx.gateway_lost_at) {
    lines.push(`⚠ 게이트웨이가 ${fmtAgo(ctx.gateway_lost_at)}부터 끊겨 급수가 거부됩니다`);
  }

  el.innerHTML = lines.join("<br>");
}

// 사건 한 줄을 사람 말로 바꿉니다.
function describe(e) {
  const v = (x) => VALUE_LABEL[x] ?? x;

  if (e.k === "water") {
    const tag = STATUS_LABEL[e.status] || e.status;
    if (e.status === "completed") {
      return { cls: "ok", tag, text: `${e.ml}mL${e.pms ? ` · ${(e.pms / 1000).toFixed(1)}초` : ""}${e.src === "web" ? " · 웹" : ""}` };
    }
    const why = REASONS[e.r] || e.r || "";
    const extra = e.ml ? ` (${e.ml}mL 나감)` : "";
    return { cls: "no", tag, text: `${why}${extra}` };
  }
  if (e.k === "gateway" && String(e.f).startsWith("sensors:")) {
    const to = String(e.t).replace("sensors:", "");
    return { cls: to === "true" ? "ok" : "no", tag: "누수센서", text: to === "true" ? "살아남" : "응답 없음" };
  }

  const label = KIND_LABEL[e.k] || e.k;
  const to = v(e.t);
  const bad =
    (e.k === "reservoir" && e.t !== "ok") ||
    (e.k === "leak" && e.t !== "none") ||
    (e.k === "lock" && e.t === "true") ||
    (e.k === "gateway" && e.t === "false") ||
    (e.k === "device" && e.t === "offline");
  const from = e.f ? `${v(e.f)} → ` : "";
  return { cls: bad ? "no" : "ok", tag: label, text: `${from}${to}` };
}

let logLimit = 30;

async function loadLog() {
  const res = await fetch(api(`/api/events?limit=${logLimit}`));
  const events = (await res.json()) || [];
  const el = document.getElementById("log");

  if (!events.length) {
    el.innerHTML = `<div class="empty">아직 기록이 없습니다</div>`;
    return;
  }

  let day = null;
  el.innerHTML = events.map((e) => {
    const d = describe(e);
    const thisDay = fmtDay(e.ts);
    const header = thisDay !== day ? `<div class="log-day">${thisDay}</div>` : "";
    day = thisDay;
    return `${header}<div class="log-row">
      <div class="log-time">${fmtTime(e.ts)}</div>
      <div class="log-what ${d.cls}"><span class="tag">${d.tag}</span>${d.text}</div>
    </div>`;
  }).join("");
}

document.getElementById("logTabs").addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  logLimit = Number(btn.dataset.n);
  for (const b of document.querySelectorAll("#logTabs button")) {
    b.setAttribute("aria-pressed", String(b === btn));
  }
  loadLog();
});

async function loadChart() {
  const res = await fetch(api(`/api/history?hours=${hours}`));
  const samples = await res.json();
  drawChart(samples || []);
}

function drawChart(samples) {
  const el = document.getElementById("chart");
  const pts = samples.filter((s) => s.m != null);
  const waters = samples.filter((s) => s.w > 0);

  if (pts.length < 2) {
    el.innerHTML = `<div class="empty">아직 그릴 만큼 쌓이지 않았습니다</div>`;
    return;
  }

  const W = 700, H = 220, PL = 34, PR = 8, PT = 10, PB = 22;
  const t0 = Math.min(...samples.map((s) => s.ts));
  const t1 = Math.max(...samples.map((s) => s.ts));
  const span = Math.max(t1 - t0, 1);

  const x = (ts) => PL + ((ts - t0) / span) * (W - PL - PR);
  const y = (v) => PT + (1 - v / 100) * (H - PT - PB);

  const line = pts.map((s, i) => `${i ? "L" : "M"}${x(s.ts).toFixed(1)},${y(s.m).toFixed(1)}`).join("");
  const area = `${line}L${x(pts[pts.length - 1].ts).toFixed(1)},${y(0)}L${x(pts[0].ts).toFixed(1)},${y(0)}Z`;

  const grid = [0, 25, 50, 75, 100].map((v) => `
    <line x1="${PL}" y1="${y(v)}" x2="${W - PR}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/>
    <text x="${PL - 6}" y="${y(v) + 3.5}" text-anchor="end" font-size="10" fill="var(--dim)">${v}</text>`).join("");

  // 급수는 세로선으로 표시합니다. 물을 준 뒤 얼마나 올랐는지가 한눈에
  // 보여야 급수량과 주기를 판단할 수 있습니다.
  const marks = waters.map((s) => `
    <line x1="${x(s.ts).toFixed(1)}" y1="${PT}" x2="${x(s.ts).toFixed(1)}" y2="${H - PB}"
          stroke="var(--water)" stroke-width="1.5" stroke-dasharray="3 2" opacity=".8"/>`).join("");

  const ticks = [0, 0.5, 1].map((f) => {
    const ts = t0 + span * f;
    const d = new Date(ts * 1000);
    const label = hours <= 24
      ? `${d.getHours()}시`
      : `${d.getMonth() + 1}/${d.getDate()}`;
    const anchor = f === 0 ? "start" : f === 1 ? "end" : "middle";
    return `<text x="${x(ts).toFixed(1)}" y="${H - 6}" text-anchor="${anchor}" font-size="10" fill="var(--dim)">${label}</text>`;
  }).join("");

  el.innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="흙 수분 추이">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="var(--accent)" stop-opacity=".22"/>
          <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
        </linearGradient>
      </defs>
      ${grid}${marks}
      <path d="${area}" fill="url(#g)"/>
      <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2"
            stroke-linejoin="round" stroke-linecap="round"/>
      ${ticks}
    </svg>`;
}

document.getElementById("tabs").addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  hours = Number(btn.dataset.h);
  for (const b of document.querySelectorAll("#tabs button")) {
    b.setAttribute("aria-pressed", String(b === btn));
  }
  loadChart();
});

// 거부 사유는 장치가 정한 문자열입니다. 그대로 보여주면 무슨 일인지
// 알기 어려우므로 사람 말로 바꿉니다.
const REASONS = {
  cooldown: "쿨다운 중입니다. 조금 뒤에 다시 하세요",
  daily_limit: "오늘 한도를 다 썼습니다",
  reservoir_empty: "물통이 비었습니다",
  reservoir_unknown: "물통 상태를 모릅니다",
  leak_detected: "누수가 감지됐습니다",
  leak_stale: "누수 상태를 믿을 수 없습니다",
  locked: "누수로 잠겨 있습니다",
  dose_too_large: "요청량이 상한을 넘습니다",
  already_running: "이미 급수 중입니다",
  clock_unsynced: "장치 시각이 맞춰지지 않았습니다",
};

// 사람이 읽을 수 있게 바꾸는 표들.
const KIND_LABEL = {
  water: "급수", reservoir: "물통", leak: "누수",
  lock: "잠금", gateway: "게이트웨이", device: "장치",
};
const STATUS_LABEL = { completed: "완료", rejected: "거부", aborted: "중단" };
const VALUE_LABEL = {
  ok: "정상", empty: "비었음", unknown: "모름",
  none: "없음", detected: "감지됨",
  true: "예", false: "아니오",
  online: "연결됨", offline: "끊김",
};

const fmtTime = (ts) => {
  const d = new Date(ts * 1000);
  return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
};
const fmtDay = (ts) => {
  const d = new Date(ts * 1000);
  const today = new Date();
  const same = d.toDateString() === today.toDateString();
  const yday = new Date(today.getTime() - 86400000).toDateString() === d.toDateString();
  if (same) return "오늘";
  if (yday) return "어제";
  return `${d.getMonth() + 1}월 ${d.getDate()}일`;
};
// "3분 전", "2시간 전"처럼 지금으로부터 얼마나 됐는지.
const fmtAgo = (ts) => {
  const s = Math.max(0, Math.floor(Date.now() / 1000) - ts);
  if (s < 60) return `${s}초 전`;
  if (s < 3600) return `${Math.floor(s / 60)}분 전`;
  if (s < 86400) return `${Math.floor(s / 3600)}시간 ${Math.floor((s % 3600) / 60)}분 전`;
  return `${Math.floor(s / 86400)}일 전`;
};
const fmtDur = (s) => {
  s = Math.max(0, Math.round(s));
  if (s < 60) return `${s}초`;
  const m = Math.floor(s / 60);
  if (m < 60) return `${m}분 ${s % 60}초`;
  return `${Math.floor(m / 60)}시간 ${m % 60}분`;
};

const resultEl = document.getElementById("result");
let armed = null;   // 확인을 기다리는 버튼
let busy = false;

function setDosesDisabled(v) {
  for (const b of document.querySelectorAll("#doses button")) b.disabled = v;
}

function disarm() {
  if (!armed) return;
  armed.classList.remove("confirm");
  armed.textContent = armed.dataset.ml + " mL";
  armed = null;
}

document.getElementById("doses").addEventListener("click", async (e) => {
  const btn = e.target.closest("button");
  if (!btn || busy) return;

  // 물은 되돌릴 수 없으므로 한 번 더 묻습니다.
  if (armed !== btn) {
    disarm();
    armed = btn;
    btn.classList.add("confirm");
    btn.textContent = "정말?";
    resultEl.className = "result";
    resultEl.textContent = "한 번 더 누르면 물이 나갑니다";
    return;
  }

  const ml = Number(btn.dataset.ml);
  disarm();
  busy = true;
  setDosesDisabled(true);
  resultEl.className = "result";
  resultEl.textContent = `${ml}mL 요청 중…`;

  try {
    const res = await fetch(api("/api/water"), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ dose_ml: ml }),
    });
    const data = await res.json();

    if (!res.ok) {
      resultEl.className = "result no";
      resultEl.textContent = data.error || `실패 (HTTP ${res.status})`;
    } else if (data.status === "completed") {
      resultEl.className = "result ok";
      resultEl.textContent = `${data.estimated_ml}mL 나갔습니다`;
    } else if (data.status === "aborted") {
      resultEl.className = "result no";
      resultEl.textContent = `중단됨 — ${REASONS[data.reason] || data.reason} (${data.estimated_ml}mL 나감)`;
    } else {
      resultEl.className = "result no";
      resultEl.textContent = REASONS[data.reason] || data.reason || "거부됐습니다";
      // 거부된 이유의 배경을 바로 아래에 펼칩니다.
      if (data.context) renderWaterHint(lastState || {}, data.context);
    }
  } catch (err) {
    resultEl.className = "result no";
    resultEl.textContent = "요청을 보내지 못했습니다";
  } finally {
    busy = false;
    setDosesDisabled(false);
    tick();
  }
});

// 다른 곳을 누르면 확인 상태를 풉니다.
document.addEventListener("click", (e) => {
  if (!e.target.closest("#doses")) disarm();
});

async function tick() {
  try {
    await Promise.all([loadState(), loadChart(), loadLog()]);
  } catch (e) {
    // 한 번 실패해도 다음 주기에 다시 시도합니다.
  }
}

tick();
setInterval(tick, 10000);
</script>
