# 나모 파일럿용 MQTT 브로커 설정.
#
# LAN 안에서만 씁니다. 공유기 포트포워딩을 하지 않습니다. 인증 없는 브로커가
# 인터넷에 열리면 누구나 펌프를 켤 수 있습니다.

listener 1883 0.0.0.0
allow_anonymous true

# 재시작해도 retain 메시지와 구독 상태를 유지합니다. status 토픽이
# retain이라 이게 없으면 브로커 재시작 때 온라인 여부를 잃습니다.
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type notice
