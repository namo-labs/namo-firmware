# Zigbee2MQTT 설정. ~/zigbee2mqtt/data/configuration.yaml로 복사해 씁니다.
#
# macOS에서는 컨테이너로 USB 패스스루가 되지 않아 네이티브로 실행합니다.
# Mosquitto만 Docker로 띄우고 여기서 그 브로커에 접속합니다.

mqtt:
  base_topic: zigbee2mqtt
  server: mqtt://localhost:1883

serial:
  # SONOFF ZBDongle-E. 포트 이름은 꽂는 위치에 따라 달라지므로
  # `ls /dev/cu.usbserial-*`로 확인해 맞춥니다.
  port: /dev/cu.usbserial-3130
  # ZBDongle-E는 EmberZNet 칩입니다. TI 칩을 쓰는 ZBDongle-P와 달라
  # adapter를 ember로 지정해야 합니다. 이걸 틀리면 동글을 못 엽니다.
  adapter: ember
  baudrate: 115200

frontend:
  enabled: true
  port: 8080

advanced:
  log_level: info
  # 채널 25는 WiFi 대역과 겹침이 가장 적은 축입니다. 파일럿에서 WiFi와
  # Zigbee를 같은 방에서 쓰므로 간섭을 줄입니다.
  channel: 25

homeassistant:
  enabled: false

# 센서 생존 여부를 별도 토픽으로 알립니다 (`zigbee2mqtt/<name>/availability`).
#
# 누수센서는 배터리 기기라 이벤트가 있을 때만 값을 보냅니다. "마지막 값이
# 오래됐다"만으로 판단하면 멀쩡한 센서를 죽었다고 오판하게 되므로,
# Zigbee2MQTT가 직접 판정한 생존 여부를 함께 씁니다.
availability:
  enabled: true
  passive:
    # 배터리 기기의 무응답 허용 시간(분). 기본 1500분(25시간)은 너무 길어
    # 센서가 죽어도 하루가 지나야 알아챕니다. Aqara 누수센서의 주기 보고가
    # 약 1시간이므로 여유를 두고 90분으로 잡습니다.
    timeout: 90

devices:
  # retain을 켜면 브로커가 마지막 상태를 보관합니다. ESP32가 재부팅한 뒤
  # 구독하자마자 값을 받으므로, 누수 이벤트가 없는 동안 계속 `unknown`에
  # 갇혀 급수를 못 하는 상황을 막습니다.
  '0x00158d008c842462':
    friendly_name: leak_tank
    retain: true
  '0x00158d008b7d8e17':
    friendly_name: leak_pot
    retain: true
